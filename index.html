<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ABUSEMAN</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        background: #000;
        color: #00ff41;
        font-family: "Courier New", monospace;
        height: 100vh;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    /* Matrix-like background */
    .background {
        position: absolute;
        inset: 0;
        background:
            radial-gradient(circle at center, rgba(0,255,65,0.15), transparent 60%),
            repeating-linear-gradient(
                0deg,
                rgba(0,255,65,0.05),
                rgba(0,255,65,0.05) 1px,
                transparent 1px,
                transparent 3px
            );
        animation: pulse 4s infinite ease-in-out;
    }

    @keyframes pulse {
        50% {
            opacity: 0.5;
        }
    }

    .container {
        position: relative;
        text-align: center;
        z-index: 10;
    }

    h1 {
        font-size: 5rem;
        letter-spacing: 10px;
        text-transform: uppercase;
        text-shadow:
            0 0 10px #00ff41,
            0 0 20px #00ff41,
            0 0 40px #00ff41;
        animation: glitch 1.5s infinite;
    }

    .subtitle {
        margin-top: 20px;
        color: #888;
        font-size: 1rem;
        letter-spacing: 3px;
    }

    @keyframes glitch {
        0%, 100% {
            transform: translate(0);
        }
        20% {
            transform: translate(-2px, 2px);
        }
        40% {
            transform: translate(2px, -2px);
        }
        60% {
            transform: translate(-2px, 0);
        }
        80% {
            transform: translate(2px, 0);
        }
    }

    .cursor {
        animation: blink 1s infinite;
    }

    @keyframes blink {
        50% {
            opacity: 0;
        }
    }
</style>
</head>

<body>

<div class="background"></div>

<div class="container">
    <h1>ABUSEMAN<span class="cursor">_</span></h1>
    <div class="subtitle">SELAMAT DATANG KE TAMAN SEKODENG!!!</div>
</div>

</body>
</html>
